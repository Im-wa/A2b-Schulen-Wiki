<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A2b Wiki</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* === CSS VARIABLEN (Theming) === */
        :root {
            --glass-bg: rgba(255, 255, 255, 0.85);
            --text-color: #333;
            --heading-color: #111;
            --accent-color: #555;
            --link-color: #666;
            --link-hover: #000;
            --btn-bg: rgba(0,0,0,0.7);
            --btn-hover: black;
        }

        /* === DARK MODE VARIABLEN === */
        body.dark-mode {
            --glass-bg: rgba(30, 30, 30, 0.85);
            --text-color: #ddd;
            --heading-color: #fff;
            --accent-color: #bbb;
            --link-color: #aaa;
            --link-hover: #fff;
            --btn-bg: rgba(255,255,255,0.2);
            --btn-hover: rgba(255,255,255,0.4);
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #555;
            background-size: cover;
            background-position: center;
            transition: background-image 1s ease-in-out;
        }

        .wiki-container {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            max-width: 700px;
            width: 90%;
            margin: 20px;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            max-height: 90vh;
            transition: background 0.3s, color 0.3s;
        }

        /* Navigation */
        .nav {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            border-bottom: 2px solid rgba(0,0,0,0.1);
            padding-bottom: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .nav a {
            text-decoration: none;
            color: var(--link-color);
            font-weight: bold;
            cursor: pointer;
            transition: color 0.2s;
        }

        .nav a:hover { color: var(--link-hover); }
        .nav a.active { color: var(--text-color); border-bottom: 2px solid var(--text-color); }

        /* Inhaltsbereich */
        .content { 
            line-height: 1.6; 
            overflow-y: auto; 
            padding-right: 10px;
            flex-grow: 1;
        }
        
        .content h1 { margin-top: 0; font-weight: 300; color: var(--heading-color); }
        .content h2 { font-weight: 400; color: var(--heading-color); border-bottom: 1px solid rgba(0,0,0,0.1); padding-bottom: 5px; }
        .content img { max-width: 100%; border-radius: 8px; margin-top: 10px; }
        .content blockquote { border-left: 4px solid var(--accent-color); padding-left: 15px; margin-left: 0; color: var(--accent-color); font-style: italic; }
        .content a { color: var(--text-color); text-decoration: underline; }

        /* Buttons unten */
        .controls { 
            margin-top: 20px; 
            padding-top: 20px;
            border-top: 1px solid rgba(0,0,0,0.1);
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            background: var(--btn-bg);
            color: var(--text-color);
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
            font-size: 0.9em;
        }

        button:hover { background: var(--btn-hover); }

        #theme-toggle { margin-left: auto; }
    </style>
</head>
<body>

<div class="wiki-container">
    <div class="nav" id="navigation">
        </div>
    
    <div class="content" id="wiki-content">
        <p>Lade Inhalte...</p>
    </div>
    
    <div class="controls">
        <button onclick="changeBackground()">Neues Bild</button>
        <button id="theme-toggle" onclick="toggleDarkMode()">🌓 Modus</button>
    </div>
</div>

<script>
 
    const githubUser = 'Im-wa';
    const githubRepo = 'A2b-Schulen-Wki';   
    

    // --- Dark Mode Logik ---
    function toggleDarkMode() {
        document.body.classList.toggle('dark-mode');
        let theme = document.body.classList.contains('dark-mode') ? 'dark' : 'light';
        localStorage.setItem('themePreference', theme);
    }

    function loadThemePreference() {
        if (localStorage.getItem('themePreference') === 'dark') {
            document.body.classList.add('dark-mode');
        }
    }

    // --- Hintergrund ---
    function changeBackground() {
        const randomNum = Math.floor(Math.random() * 1000);
        const imageUrl = `https://picsum.photos/1920/1080?nature,water,forest&sig=${randomNum}`;
        const img = new Image();
        img.src = imageUrl;
        img.onload = () => { document.body.style.backgroundImage = `url('${imageUrl}')`; };
    }

    // --- Automatisches Menü ---
    async function buildMenuAutomatically() {
        const nav = document.getElementById('navigation');
        nav.innerHTML = ''; // Leert das Menü sicherheitshalber am Anfang

        try {
            const response = await fetch(`https://api.github.com/repos/${githubUser}/${githubRepo}/contents/`);
            if (!response.ok) throw new Error('Konnte Repository nicht finden');
            const files = await response.json();

            files.forEach(file => {
                if (file.name.endsWith('.md') && file.name.toLowerCase() !== 'readme.md') {
                    const pageName = file.name.replace('.md', '');
                    
                    const newLink = document.createElement('a');
                    newLink.textContent = pageName.charAt(0).toUpperCase() + pageName.slice(1);
                    newLink.setAttribute('href', '#' + pageName);
                    nav.appendChild(newLink);
                }
            });
        } catch (error) {
            console.warn("GitHub API nicht erreichbar. Hast du User und Repo eingetragen?");
            nav.innerHTML = '<span style="color:red; font-size:0.9em;">Menü konnte nicht geladen werden.</span>';
        }
        
        // Nachdem das Menü gebaut wurde, laden wir den Inhalt
        handleHashChange();
    }

    // --- Seiteninhalt laden ---
    async function handleHashChange() {
        let hash = window.location.hash.substring(1);
        if (!hash) { window.location.hash = 'home'; return; }
        
        const contentDiv = document.getElementById('wiki-content');
        
        // Menü-Hervorhebung aktualisieren
        document.querySelectorAll('.nav a').forEach(a => {
            a.classList.remove('active');
            if (a.getAttribute('href') === '#' + hash) a.classList.add('active');
        });

        // Markdown-Datei abrufen
        try {
            contentDiv.innerHTML = '<p>Lade...</p>';
            const response = await fetch(hash + '.md');
            if (!response.ok) throw new Error('Seite nicht gefunden');
            
            const markdownText = await response.text();
            contentDiv.innerHTML = marked.parse(markdownText);
            contentDiv.scrollTop = 0; // Nach oben scrollen
        } catch (error) {
            contentDiv.innerHTML = `
                <h2>Fehler 404</h2>
                <p>Die Seite <b>${hash}.md</b> konnte auf dem Server nicht gefunden werden.</p>
                <p>Bitte stelle sicher, dass die Datei existiert und keine Sonderzeichen/Umlaute im Dateinamen hat.</p>
            `;
        }
    }

    // Hört auf URL-Änderungen (Zurück-Button im Browser)
    window.addEventListener('hashchange', handleHashChange);

    // Initialisierung beim Start
    window.onload = () => {
        loadThemePreference();    // 1. Theme setzen
        changeBackground();       // 2. Hintergrundbild laden
        buildMenuAutomatically(); // 3. Menü von GitHub abrufen und erste Seite laden
    };
</script>

</body>
</html>
